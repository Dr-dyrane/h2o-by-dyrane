name: Apply H2O Awwwards finish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-awwwards-finish.yml

permissions:
  contents: write

concurrency:
  group: h2o-apply-awwwards-finish
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Materialize final Awwwards pass
        env:
          H2O_AWWWARDS_PAYLOAD: 
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$H2O_AWWWARDS_PAYLOAD" | base64 --decode > /tmp/h2o-awwwards-files.tgz
          tar -xzf /tmp/h2o-awwwards-files.tgz -C .
          git diff --check
      - name: Verify final candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/verify-motion-contract.mjs
          node scripts/verify-awwwards-finish.mjs
          npm run lint
          npm run build
      - name: Commit final candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/quality.yml \
            docs/awwwards/submission.md \
            scripts/verify-awwwards-finish.mjs \
            src/styles/immersive.css \
            src/styles/immersive/award-finish.css
          if git diff --cached --quiet; then
            echo "Awwwards finish is already materialized."
            exit 0
          fi
          git commit -m "feat: finish H2O for Awwwards submission"
          git push origin HEAD:main
