name: Finalize spatial motion

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-spatial-motion.yml

permissions:
  contents: write

concurrency:
  group: h2o-spatial-motion-materializer-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Materialize or refine spatial source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return source.replace(old, new, 1)

          if not Path('scripts/verify-spatial-hover.mjs').exists() or 'pointerSlow' not in Path('src/motion/tokens.ts').read_text():
              workflow = Path('.github/workflows/materialize-spatial-motion.yml').read_text().splitlines()
              start = workflow.index("          python - <<'PY'") + 1
              end = workflow.index('          PY', start)
              script = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end])

              old = """portfolio = replace_once(portfolio, hook_marker, local_hook.replace('          ', '') + hook_marker, 'local spatial hook')
              portfolio = replace_between(portfolio, 'function ProjectChapter({', '\\ntype PracticeStep =', project_chapter.replace('          ', ''), 'ProjectChapter')""".replace('              ', '')
              new = """portfolio = replace_between(portfolio, 'function ProjectChapter({', '\\ntype PracticeStep =', project_chapter.replace('          ', ''), 'ProjectChapter')
              portfolio = replace_once(portfolio, hook_marker, local_hook.replace('          ', '') + hook_marker, 'local spatial hook')""".replace('              ', '')
              if script.count(old) != 1:
                  raise SystemExit(f'expected one materializer order fragment, found {script.count(old)}')
              script = script.replace(old, new, 1)

              old_transforms = """            const pointerShiftX = useTransform([pointerX, pointerPresence], ([x, presence]) => x * presence * 38)
              const pointerShiftY = useTransform([pointerY, pointerPresence], ([y, presence]) => y * presence * 22)
              const pointerRotateY = useTransform([pointerX, pointerPresence], ([x, presence]) => x * presence * 3.2)"""
              new_transforms = """            const pointerShiftX = useTransform(pointerX, [-1, 1], [-38, 38])
              const pointerShiftY = useTransform(pointerY, [-1, 1], [-22, 22])
              const pointerRotateY = useTransform(pointerX, [-1, 1], [-3.2, 3.2])"""
              if script.count(old_transforms) != 1:
                  raise SystemExit(f'expected one practice transform fragment, found {script.count(old_transforms)}')
              script = script.replace(old_transforms, new_transforms, 1)
              exec(compile(script, 'spatial-materializer', 'exec'), {})

          portfolio_path = Path('src/components/immersive/ImmersivePortfolio.tsx')
          portfolio = portfolio_path.read_text()
          scale_line = "  const pointerWordScale = useTransform(pointerPresence, [0, 1], [1, 1.008])\n"
          if scale_line not in portfolio:
              portfolio = replace_once(
                  portfolio,
                  "  const pointerRotateY = useTransform(pointerX, [-1, 1], [-3.2, 3.2])\n",
                  "  const pointerRotateY = useTransform(pointerX, [-1, 1], [-3.2, 3.2])\n" + scale_line,
                  'practice pointer settle scale',
              )
              portfolio = replace_once(
                  portfolio,
                  '            style={{ x: pointerShiftX, y: pointerShiftY, rotateY: pointerRotateY }}',
                  '            style={{ x: pointerShiftX, y: pointerShiftY, rotateY: pointerRotateY, scale: pointerWordScale }}',
                  'practice pointer scale style',
              )
          portfolio_path.write_text(portfolio)

          motion_path = Path('src/styles/immersive/motion.css')
          motion = motion_path.read_text()
          coarse_rule = """@media (pointer: coarse), (max-width: 900px) {
  .h2o-archive-card:hover {
    transform: translateY(-36%) translateZ(0) rotateY(0deg);
  }

"""
          if coarse_rule not in motion:
              motion = replace_once(
                  motion,
                  "@media (pointer: coarse), (max-width: 900px) {\n",
                  coarse_rule,
                  'coarse archive hover reset',
              )
          reduced_rule = """@media (prefers-reduced-motion: reduce) {
  .h2o-archive-card,
  .h2o-archive-card:hover {
    transform: none !important;
  }

"""
          if reduced_rule not in motion:
              motion = replace_once(
                  motion,
                  "@media (prefers-reduced-motion: reduce) {\n",
                  reduced_rule,
                  'reduced archive hover reset',
              )
          motion_path.write_text(motion)
          PY
      - run: npm ci
      - run: node scripts/verify-motion-contract.mjs
      - run: npm run lint
      - run: npm run build
      - name: Locate Chromium
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            npx @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/puppeteer"
            browser="$(find "$RUNNER_TEMP/puppeteer" -type f \( -name chrome -o -name chromium \) | head -n 1)"
          fi
          test -n "$browser"
          echo "PUPPETEER_EXECUTABLE_PATH=$browser" >> "$GITHUB_ENV"
      - name: Start production server
        shell: bash
        run: |
          npm run start > /tmp/h2o-spatial-final.log 2>&1 &
          echo $! > /tmp/h2o-spatial-final.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5173 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/h2o-spatial-final.log
          exit 1
      - run: npm run verify:spatial
      - run: git diff --check
      - name: Publish certified spatial motion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/portfolio
          source_head="$(git rev-parse HEAD)"
          cat > docs/portfolio/spatial-motion-validation.md <<EOF
          # Spatial motion validation

          The H₂O portfolio motion system is certified against the production build.

          - Lower-frequency shared springs absorb wheel and trackpad stepping.
          - Fine-pointer movement changes the hero viewpoint, project-plane tilt, counter-parallax, local light, archive depth, and WebGL current.
          - Touch and coarse pointers remain flat and stable.
          - Reduced-motion mode removes pointer depth and the WebGL canvas.
          - Browser proof: \`npm run verify:spatial\`.
          - Source head validated: \`${source_head}\`.
          EOF
          rm -f .github/workflows/materialize-spatial-motion.yml
          rm -f .github/workflows/materialize-spatial-motion-v2.yml
          rm -f .github/workflows/certify-spatial-motion.yml
          rm -f .github/workflows/finalize-spatial-motion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: release spatial Apple-like motion"
          git push origin HEAD:main
