name: Repair deferred WebGL compact scope

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-compact-scope.yml

permissions:
  contents: write

concurrency:
  group: h2o-fix-compact-scope
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Repair scoped compact quality flag
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/immersive/LiquidCurrentScene.tsx')
          source = path.read_text()
          old = 'dpr={compact ? webglMotionBudget.compact.dpr : webglMotionBudget.full.dpr}'
          new = 'dpr={props.compact ? webglMotionBudget.compact.dpr : webglMotionBudget.full.dpr}'
          if source.count(old) != 1:
              raise SystemExit(f'expected one compact scope error, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY

          grep -F 'dpr={props.compact ? webglMotionBudget.compact.dpr : webglMotionBudget.full.dpr}' src/components/immersive/LiquidCurrentScene.tsx
          npm ci
          npm run lint
          npm run build

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/immersive/LiquidCurrentScene.tsx
          git commit -m "fix: scope compact WebGL quality to scene props"
          git push
