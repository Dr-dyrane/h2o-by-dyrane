name: Retry perceptual finalizer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retry-perceptual-finalizer.yml

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retrigger the validated finalizer
        shell: bash
        run: |
          set -euo pipefail
          printf '\n# Retry after perceptual finish contract alignment.\n' >> .github/workflows/finalize-perceptual-motion-og-v2.yml
          rm .github/workflows/retry-perceptual-finalizer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/finalize-perceptual-motion-og-v2.yml .github/workflows/retry-perceptual-finalizer.yml
          git commit -m "chore: rerun perceptual motion finalizer"
          git push origin HEAD:main
