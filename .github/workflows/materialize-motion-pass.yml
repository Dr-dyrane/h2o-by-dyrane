name: Materialize H2O fluid motion pass

on:
  push:
    branches: [main]
    paths:
      - .staging/motion-pass/**
      - .github/workflows/materialize-motion-pass.yml

permissions:
  contents: write

concurrency:
  group: h2o-materialize-motion-pass
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Materialize and validate the fluid motion pass
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p src/components/immersive src/motion src/styles/immersive scripts

          cat .staging/motion-pass/chunks/ImmersivePortfolio.* | tr -d '\n\r ' | base64 --decode > src/components/immersive/ImmersivePortfolio.tsx
          cat .staging/motion-pass/chunks/LiquidCurrentScene.* | tr -d '\n\r ' | base64 --decode > src/components/immersive/LiquidCurrentScene.tsx

          cp .staging/motion-pass/files/src/components/immersive/LiquidCurrentCanvas.tsx src/components/immersive/LiquidCurrentCanvas.tsx
          cp .staging/motion-pass/files/src/motion/tokens.ts src/motion/tokens.ts
          cp .staging/motion-pass/files/src/styles/immersive/motion.css src/styles/immersive/motion.css
          cp .staging/motion-pass/files/src/styles/immersive.css src/styles/immersive.css
          cp .staging/motion-pass/files/scripts/verify-motion-contract.mjs scripts/verify-motion-contract.mjs

          echo '8ae76a6ace4afa5a08858163682969799622edc8f4bd9c636e0cd2f54a1c2c5b  src/components/immersive/ImmersivePortfolio.tsx' | sha256sum -c -
          echo 'a857ae12de5d6072d514a437d12a12a0ce903ccf2758e6e757c82af8a24ec04b  src/components/immersive/LiquidCurrentScene.tsx' | sha256sum -c -
          echo '04b23782d91d8b9090a54a63cc8e899718ebc391b7248accdc7f341a597dd19d  src/components/immersive/LiquidCurrentCanvas.tsx' | sha256sum -c -
          echo 'e22bc824f3b804d2f6fbff76cf7212f65711100b52526ed8016dffcf2aecca02  src/motion/tokens.ts' | sha256sum -c -
          echo 'df2ef96860424d0532389db867ada40618be263087cce94d3fb44821476e7eba  src/styles/immersive/motion.css' | sha256sum -c -
          echo '5cb12fcf17a458baa5e1ff80bc2f28425d073013a47556019df9fd9356b9080f  scripts/verify-motion-contract.mjs' | sha256sum -c -
          echo 'b7e1d435d51cb7ba8edfdd4502bf0037ef1408e32bb98001b2dbb3fb84a0e908  src/styles/immersive.css' | sha256sum -c -

          node scripts/verify-motion-contract.mjs
          npm ci
          npm run lint
          npm run build

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/immersive/ImmersivePortfolio.tsx \
            src/components/immersive/LiquidCurrentScene.tsx \
            src/components/immersive/LiquidCurrentCanvas.tsx \
            src/motion/tokens.ts \
            src/styles/immersive/motion.css \
            src/styles/immersive.css \
            scripts/verify-motion-contract.mjs
          git commit -m "perf: fluid motion tokens and preview-led JUW mobile"
          git push
