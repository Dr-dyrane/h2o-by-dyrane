name: Materialize spatial Apple-like motion

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-spatial-motion.yml

permissions:
  contents: write

concurrency:
  group: h2o-spatial-motion-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Materialize motion and hover system
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return source.replace(old, new, 1)

          def replace_between(source: str, start: str, end: str, replacement: str, label: str) -> str:
              start_index = source.find(start)
              if start_index < 0:
                  raise SystemExit(f"{label}: start marker missing")
              end_index = source.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f"{label}: end marker missing")
              return source[:start_index] + replacement.rstrip() + source[end_index:]

          tokens = '''// Profiled by .github/workflows/motion-profile.yml and runtime-probed after WebGL loads.
          // These curves use decisive acceleration, a long soft deceleration, and one clean settle.
          export const fluidEase: [number, number, number, number] = [0.16, 1, 0.3, 1]
          export const appleEase: [number, number, number, number] = [0.32, 0.72, 0, 1]
          export const appleEaseInOut: [number, number, number, number] = [0.65, 0, 0.35, 1]

          const settle = {
            restDelta: 0.001,
            restSpeed: 0.015,
          } as const

          // Lower-frequency springs absorb wheel/trackpad stepping instead of transmitting it directly.
          export const motionSprings = {
            world: {
              stiffness: 210,
              damping: 28,
              mass: 0.82,
              ...settle,
            },
            hero: {
              stiffness: 240,
              damping: 27,
              mass: 0.78,
              ...settle,
            },
            spatial: {
              stiffness: 185,
              damping: 27,
              mass: 0.88,
              ...settle,
            },
            gallery: {
              stiffness: 225,
              damping: 28,
              mass: 0.8,
              ...settle,
            },
            pointer: {
              stiffness: 260,
              damping: 24,
              mass: 0.7,
              ...settle,
            },
            pointerSlow: {
              stiffness: 170,
              damping: 23,
              mass: 0.82,
              ...settle,
            },
          } as const

          export const motionTransitions = {
            micro: { duration: 0.26, ease: appleEase },
            reveal: { duration: 0.64, ease: fluidEase },
            cinematic: { duration: 0.98, ease: appleEase },
            settle: { duration: 0.78, ease: appleEaseInOut },
          } as const

          export const webglMotionBudget = {
            idleWindowMs: 720,
            idleLoadTimeoutMs: 560,
            fallbackLoadDelayMs: 90,
            full: {
              dpr: 1,
              particleCount: 220,
              filamentCount: 3,
              filamentSegments: 48,
              filamentRadialSegments: 3,
              primaryDetail: 3,
              secondaryDetail: 2,
              nodeSegments: 8,
            },
            compact: {
              dpr: 0.85,
              particleCount: 120,
              filamentCount: 1,
              filamentSegments: 28,
              filamentRadialSegments: 3,
              primaryDetail: 2,
              secondaryDetail: 1,
              nodeSegments: 6,
            },
          } as const

          export function frameBlend(lambda: number, delta: number) {
            return 1 - Math.exp(-lambda * delta)
          }
          '''
          Path('src/motion/tokens.ts').write_text(tokens.replace('          ', '').rstrip() + '\n')

          project_chapter = '''function ProjectChapter({
            project,
            index,
            active,
            spatialEnabled,
            register,
          }: {
            project: ImmersiveProject
            index: number
            active: boolean
            spatialEnabled: boolean
            register: (element: HTMLElement | null, index: number) => void
          }) {
            const sectionRef = useRef<HTMLElement | null>(null)
            const direction = index % 2 === 0 ? 1 : -1
            const { scrollYProgress } = useScroll({
              target: sectionRef,
              offset: ['start end', 'end start'],
            })
            const progress = useSpring(scrollYProgress, motionSprings.gallery)
            const mediaScale = useTransform(progress, [0, 0.24, 0.74, 1], [0.87, 1, 1, 0.92])
            const mediaX = useTransform(
              progress,
              [0, 0.24, 0.74, 1],
              [`${direction * 9}%`, '0%', '0%', `${direction * -5}%`],
            )
            const mediaY = useTransform(progress, [0, 0.5, 1], ['7%', '0%', '-6%'])
            const mediaRotateY = useTransform(
              progress,
              [0, 0.24, 0.74, 1],
              [direction * -7, 0, 0, direction * 4],
            )
            const copyX = useTransform(
              progress,
              [0, 0.24, 0.74, 1],
              [`${direction * -7}%`, '0%', '0%', `${direction * 6}%`],
            )
            const copyY = useTransform(progress, [0, 0.5, 1], ['8%', '0%', '-8%'])
            const copyScale = useTransform(progress, [0, 0.25, 0.76, 1], [0.95, 1, 1, 0.96])
            const opacity = useTransform(progress, [0, 0.12, 0.84, 1], [0.08, 1, 1, 0.12])
            const pointer = useLocalSpatialPointer(spatialEnabled && active)
            const pointerRotateX = useTransform(pointer.y, [-1, 1], [3.4, -3.4])
            const pointerRotateY = useTransform(pointer.x, [-1, 1], [-4.8, 4.8])
            const pointerX = useTransform(pointer.x, [-1, 1], [-9, 9])
            const pointerY = useTransform(pointer.y, [-1, 1], [-6, 6])
            const pointerScale = useTransform(pointer.presence, [0, 1], [1, 1.012])
            const copyPointerX = useTransform(pointer.x, [-1, 1], [8, -8])
            const copyPointerY = useTransform(pointer.y, [-1, 1], [5, -5])
            const copyPointerZ = useTransform(pointer.presence, [0, 1], [0, 32])
            const lightX = useTransform(pointer.x, [-1, 1], [-230, 230])
            const lightY = useTransform(pointer.y, [-1, 1], [-150, 150])
            const lightOpacity = useTransform(pointer.presence, [0, 1], [0, 0.88])
            const style = {
              '--project-accent': project.accent,
              '--project-accent-soft': project.accentSoft,
            } as CSSProperties

            return (
              <article
                id={project.id}
                ref={(element) => {
                  sectionRef.current = element
                  register(element, index)
                }}
                className="h2o-project-chapter"
                style={style}
                data-project-index={index}
                data-direction={direction > 0 ? 'forward' : 'reverse'}
                data-active={active ? 'true' : 'false'}
              >
                <div className="h2o-project-sticky">
                  <div className="h2o-project-glow" aria-hidden="true" />

                  <motion.div
                    className="h2o-project-media"
                    style={{ scale: mediaScale, x: mediaX, y: mediaY, rotateY: mediaRotateY, opacity }}
                    onPointerEnter={pointer.onMove}
                    onPointerMove={pointer.onMove}
                    onPointerLeave={pointer.onLeave}
                  >
                    <motion.div
                      className="h2o-project-media__spatial"
                      style={{
                        rotateX: pointerRotateX,
                        rotateY: pointerRotateY,
                        x: pointerX,
                        y: pointerY,
                        scale: pointerScale,
                      }}
                    >
                      <motion.span
                        className="h2o-project-pointer-light"
                        style={{ x: lightX, y: lightY, opacity: lightOpacity }}
                        aria-hidden="true"
                      />
                      <div className="h2o-project-media__wash" aria-hidden="true" />
                      <ProjectImage
                        image={project.desktop}
                        className="h2o-project-media__desktop"
                        loading={index === 0 ? 'eager' : 'lazy'}
                      />
                      <div className="h2o-project-media__mobile-shell">
                        <ProjectImage image={project.mobile} className="h2o-project-media__mobile" />
                      </div>
                      <span className="h2o-project-media__index" aria-hidden="true">
                        {project.sequence}
                      </span>
                      <a
                        className="h2o-project-media-link"
                        href={project.url}
                        target="_blank"
                        rel="noreferrer"
                        aria-label={`Open ${project.title} live experience`}
                      >
                        <span>Open {project.title}</span>
                      </a>
                    </motion.div>
                  </motion.div>

                  <motion.div
                    className="h2o-project-copy"
                    style={{ x: copyX, y: copyY, scale: copyScale, opacity }}
                  >
                    <motion.div
                      className="h2o-project-copy__spatial"
                      style={{ x: copyPointerX, y: copyPointerY, z: copyPointerZ }}
                    >
                      <div className="h2o-project-kicker">
                        <span>{project.sequence}</span>
                        <span>{project.category}</span>
                        <span>{project.period}</span>
                      </div>

                      <h3>{project.title}</h3>
                      <p className="h2o-project-statement">{project.statement}</p>
                      <p className="h2o-project-description">{project.description}</p>

                      <div className="h2o-project-proof">
                        <span>Proof</span>
                        <p>{project.proof}</p>
                      </div>

                      <div className="h2o-project-actions">
                        <a href={project.url} target="_blank" rel="noreferrer">
                          Open live experience
                          <ArrowUpRight aria-hidden="true" size={18} strokeWidth={1.7} />
                        </a>
                        {project.secondaryUrl && project.secondaryLabel ? (
                          <a
                            className="h2o-project-actions__secondary"
                            href={project.secondaryUrl}
                            target="_blank"
                            rel="noreferrer"
                          >
                            {project.secondaryLabel}
                            <ArrowUpRight aria-hidden="true" size={16} strokeWidth={1.7} />
                          </a>
                        ) : null}
                        <div className="h2o-project-modes" aria-label="Practice modes">
                          {project.modes.map((mode) => (
                            <span key={mode}>{mode}</span>
                          ))}
                        </div>
                      </div>
                    </motion.div>
                  </motion.div>
                </div>
              </article>
            )
          }
          '''

          archive_components = '''type ArchiveProject = (typeof archiveProjects)[number]

          function ArchiveCard({
            project,
            index,
            spatialEnabled,
          }: {
            project: ArchiveProject
            index: number
            spatialEnabled: boolean
          }) {
            const pointer = useLocalSpatialPointer(spatialEnabled)
            const rotateX = useTransform(pointer.y, [-1, 1], [4.2, -4.2])
            const rotateY = useTransform(pointer.x, [-1, 1], [-6.5, 6.5])
            const x = useTransform(pointer.x, [-1, 1], [-8, 8])
            const y = useTransform(pointer.y, [-1, 1], [-6, 6])
            const z = useTransform(pointer.presence, [0, 1], [0, 66])
            const scale = useTransform(pointer.presence, [0, 1], [1, 1.018])
            const lightX = useTransform(pointer.x, [-1, 1], [-190, 190])
            const lightY = useTransform(pointer.y, [-1, 1], [-120, 120])
            const lightOpacity = useTransform(pointer.presence, [0, 1], [0, 0.78])
            const cardStyle = {
              '--archive-tilt': `${index % 2 === 0 ? 5 : -6}deg`,
              '--archive-depth': `${index % 2 === 0 ? 0 : -90}px`,
            } as CSSProperties

            return (
              <article
                className="h2o-archive-card"
                style={cardStyle}
                onPointerEnter={pointer.onMove}
                onPointerMove={pointer.onMove}
                onPointerLeave={pointer.onLeave}
              >
                <motion.div
                  className="h2o-archive-card__spatial"
                  style={{ rotateX, rotateY, x, y, z, scale }}
                >
                  <motion.span
                    className="h2o-archive-pointer-light"
                    style={{ x: lightX, y: lightY, opacity: lightOpacity }}
                    aria-hidden="true"
                  />
                  <img src={project.image} alt={`${project.title} product interface`} loading="lazy" />
                  <div className="h2o-archive-card__copy">
                    <span>{project.period}</span>
                    <h3>{project.title}</h3>
                    <p>{project.category}</p>
                  </div>
                </motion.div>
              </article>
            )
          }

          function ArchiveCurrent({ spatialEnabled }: { spatialEnabled: boolean }) {
            const sectionRef = useRef<HTMLElement | null>(null)
            const { scrollYProgress } = useScroll({
              target: sectionRef,
              offset: ['start start', 'end end'],
            })
            const progress = useSpring(scrollYProgress, motionSprings.gallery)
            const railX = useTransform(progress, [0, 0.08, 0.92, 1], ['8vw', '6vw', '-68%', '-70%'])
            const wordX = useTransform(progress, [0, 1], ['18vw', '-28vw'])
            const wordZ = useTransform(progress, [0, 0.55, 1], [-520, 40, -620])

            return (
              <section ref={sectionRef} className="h2o-archive" id="archive" aria-labelledby="h2o-archive-title">
                <div className="h2o-archive__sticky">
                  <div className="h2o-archive__heading">
                    <p className="h2o-section-label">The wider current</p>
                    <h2 id="h2o-archive-title">Experiments that changed what came next.</h2>
                  </div>
                  <motion.div className="h2o-archive__word" style={{ x: wordX, z: wordZ }} aria-hidden="true">
                    MORE WORK
                  </motion.div>
                  <motion.div className="h2o-archive__rail" style={{ x: railX }}>
                    {archiveProjects.map((project, index) => (
                      <ArchiveCard
                        key={project.title}
                        project={project}
                        index={index}
                        spatialEnabled={spatialEnabled}
                      />
                    ))}
                  </motion.div>
                </div>
              </section>
            )
          }
          '''

          hero_block = '''      <section ref={heroRef} className="h2o-hero" aria-labelledby="h2o-hero-title">
                <div className="h2o-hero__sticky">
                  <motion.span
                    className="h2o-hero__pointer-light"
                    style={{ x: heroLightX, y: heroLightY, opacity: heroLightOpacity }}
                    aria-hidden="true"
                  />
                  <motion.div
                    className="h2o-hero__copy"
                    style={{
                      x: heroCopyX,
                      y: heroCopyY,
                      z: heroCopyZ,
                      scale: heroCopyScale,
                      rotateY: heroCopyRotateY,
                      opacity: heroCopyOpacity,
                    }}
                  >
                    <motion.div
                      className="h2o-hero__spatial"
                      style={{
                        x: heroPointerX,
                        y: heroPointerY,
                        rotateX: heroPointerRotateX,
                        rotateY: heroPointerRotateY,
                        scale: heroPointerScale,
                      }}
                    >
                      <p className="h2o-eyebrow">
                        Alexander Udeogaranya · Doctor · Product designer · Software engineer
                      </p>
                      <motion.h1 id="h2o-hero-title" style={{ letterSpacing: heroWordSpacing }}>
                        <span>A body</span>
                        <span>of work</span>
                        <em>in motion.</em>
                      </motion.h1>
                      <div className="h2o-hero__footer">
                        <p>I observe the system, build the product, and stay for reality.</p>
                        <a href="#practice">
                          Enter the current
                          <ArrowDown aria-hidden="true" size={18} strokeWidth={1.7} />
                        </a>
                      </div>
                    </motion.div>
                  </motion.div>
                  <div className="h2o-hero__count" aria-hidden="true">
                    <strong>50+</strong>
                    <span>builds, one current</span>
                  </div>
                </div>
              </section>'''

          portfolio_path = Path('src/components/immersive/ImmersivePortfolio.tsx')
          portfolio = portfolio_path.read_text()
          portfolio = replace_once(
              portfolio,
              "  useMotionValueEvent,\n  useScroll,",
              "  useMotionValue,\n  useMotionValueEvent,\n  useReducedMotion,\n  useScroll,",
              'portfolio motion imports',
          )
          portfolio = replace_once(
              portfolio,
              "  type CSSProperties,\n  type MutableRefObject,",
              "  type CSSProperties,\n  type MutableRefObject,\n  type PointerEvent as ReactPointerEvent,",
              'portfolio pointer event type',
          )
          hook_marker = "type PracticeStep = (typeof practiceSteps)[number]"
          local_hook = '''function useLocalSpatialPointer(enabled: boolean) {
            const rawX = useMotionValue(0)
            const rawY = useMotionValue(0)
            const rawPresence = useMotionValue(0)
            const x = useSpring(rawX, motionSprings.pointer)
            const y = useSpring(rawY, motionSprings.pointer)
            const presence = useSpring(rawPresence, motionSprings.pointerSlow)

            const onMove = (event: ReactPointerEvent<HTMLElement>) => {
              if (!enabled || event.pointerType === 'touch') return
              const rect = event.currentTarget.getBoundingClientRect()
              if (rect.width <= 0 || rect.height <= 0) return
              const nextX = ((event.clientX - rect.left) / rect.width) * 2 - 1
              const nextY = ((event.clientY - rect.top) / rect.height) * 2 - 1
              rawX.set(Math.max(-1, Math.min(1, nextX)))
              rawY.set(Math.max(-1, Math.min(1, nextY)))
              rawPresence.set(1)
            }

            const onLeave = () => {
              rawX.set(0)
              rawY.set(0)
              rawPresence.set(0)
            }

            return { x, y, presence, onMove, onLeave }
          }

          '''
          portfolio = replace_once(portfolio, hook_marker, local_hook.replace('          ', '') + hook_marker, 'local spatial hook')
          portfolio = replace_between(portfolio, 'function ProjectChapter({', '\ntype PracticeStep =', project_chapter.replace('          ', ''), 'ProjectChapter')
          portfolio = replace_between(portfolio, 'function ArchiveCurrent()', '\nfunction EndCredits()', archive_components.replace('          ', ''), 'ArchiveCurrent')
          portfolio = replace_once(
              portfolio,
              "  const activityRef = useRef(0)\n  const [activeIndex, setActiveIndex] = useState(0)",
              """  const activityRef = useRef(0)
            const shouldReduceMotion = useReducedMotion()
            const spatialEnabled = shouldReduceMotion !== true
            const pointerRawX = useMotionValue(0)
            const pointerRawY = useMotionValue(0)
            const pointerRawPresence = useMotionValue(0)
            const pointerX = useSpring(pointerRawX, motionSprings.pointer)
            const pointerY = useSpring(pointerRawY, motionSprings.pointer)
            const pointerPresence = useSpring(pointerRawPresence, motionSprings.pointerSlow)
            const pointerRef = useRef({ x: 0, y: 0, presence: 0 })
            const [activeIndex, setActiveIndex] = useState(0)""".replace('            ', ''),
              'global spatial values',
          )
          portfolio = replace_once(
              portfolio,
              "  const heroWordSpacing = useTransform(smoothHeroProgress, [0, 0.7], ['-0.07em', '-0.035em'])\n",
              """  const heroWordSpacing = useTransform(smoothHeroProgress, [0, 0.7], ['-0.07em', '-0.035em'])
            const heroPointerX = useTransform(pointerX, [-1, 1], [-13, 13])
            const heroPointerY = useTransform(pointerY, [-1, 1], [-8, 8])
            const heroPointerRotateX = useTransform(pointerY, [-1, 1], [1.45, -1.45])
            const heroPointerRotateY = useTransform(pointerX, [-1, 1], [-2.1, 2.1])
            const heroPointerScale = useTransform(pointerPresence, [0, 1], [1, 1.006])
            const heroLightX = useTransform(pointerX, [-1, 1], [-260, 260])
            const heroLightY = useTransform(pointerY, [-1, 1], [-160, 160])
            const heroLightOpacity = useTransform(pointerPresence, [0, 1], [0, 0.86])
            """.replace('            ', ''),
              'hero spatial values',
          )
          effect_marker = "  useEffect(() => {\n    const observer = new IntersectionObserver("
          pointer_effect = '''  useEffect(() => {
            const reset = () => {
              pointerRawX.set(0)
              pointerRawY.set(0)
              pointerRawPresence.set(0)
              pointerRef.current = { x: 0, y: 0, presence: 0 }
            }

            if (!spatialEnabled) {
              reset()
              return undefined
            }

            const move = (event: PointerEvent) => {
              if (event.pointerType === 'touch') return
              const x = Math.max(-1, Math.min(1, (event.clientX / window.innerWidth) * 2 - 1))
              const y = Math.max(-1, Math.min(1, (event.clientY / window.innerHeight) * 2 - 1))
              pointerRawX.set(x)
              pointerRawY.set(y)
              pointerRawPresence.set(1)
              pointerRef.current = { x, y, presence: 1 }
              activityRef.current = performance.now()
            }

            window.addEventListener('pointermove', move, { passive: true })
            window.addEventListener('blur', reset)
            document.documentElement.addEventListener('mouseleave', reset)
            return () => {
              window.removeEventListener('pointermove', move)
              window.removeEventListener('blur', reset)
              document.documentElement.removeEventListener('mouseleave', reset)
            }
          }, [pointerRawPresence, pointerRawX, pointerRawY, spatialEnabled])

          '''
          portfolio = replace_once(portfolio, effect_marker, pointer_effect.replace('          ', '') + effect_marker, 'global pointer effect')
          portfolio = replace_once(
              portfolio,
              '    <main className="h2o-immersive" id="top">\n',
              """    <main
                  className="h2o-immersive"
                  id="top"
                  data-spatial-input={spatialEnabled ? 'enabled' : 'reduced'}
                >
              """.replace('              ', ''),
              'root spatial attribute',
          )
          portfolio = replace_once(
              portfolio,
              "        activityRef={activityRef as MutableRefObject<number>}\n        palette={palette}\n",
              "        activityRef={activityRef as MutableRefObject<number>}\n        pointerRef={pointerRef}\n        palette={palette}\n",
              'canvas pointer ref',
          )
          portfolio = replace_between(
              portfolio,
              '      <section ref={heroRef} className="h2o-hero" aria-labelledby="h2o-hero-title">',
              '\n      <SpatialPractice />',
              hero_block,
              'hero block',
          )
          portfolio = replace_once(
              portfolio,
              '      <SpatialPractice />',
              """      <SpatialPractice
                    pointerX={pointerX}
                    pointerY={pointerY}
                    pointerPresence={pointerPresence}
                  />""".replace('                  ', ''),
              'SpatialPractice props',
          )
          portfolio = replace_once(
              portfolio,
              'function SpatialPractice() {',
              """function SpatialPractice({
            pointerX,
            pointerY,
            pointerPresence,
          }: {
            pointerX: MotionValue<number>
            pointerY: MotionValue<number>
            pointerPresence: MotionValue<number>
          }) {""".replace('          ', ''),
              'SpatialPractice signature',
          )
          portfolio = replace_once(
              portfolio,
              "  const currentOpacity = useTransform(progress, [0, 0.5, 1], [0.1, 0.22, 0.08])\n",
              """  const currentOpacity = useTransform(progress, [0, 0.5, 1], [0.1, 0.22, 0.08])
            const pointerShiftX = useTransform([pointerX, pointerPresence], ([x, presence]) => x * presence * 38)
            const pointerShiftY = useTransform([pointerY, pointerPresence], ([y, presence]) => y * presence * 22)
            const pointerRotateY = useTransform([pointerX, pointerPresence], ([x, presence]) => x * presence * 3.2)
            """.replace('            ', ''),
              'SpatialPractice pointer values',
          )
          portfolio = replace_once(
              portfolio,
              """        <motion.div
          className="h2o-practice__current-word"
          style={{ x: currentX, z: currentZ, opacity: currentOpacity }}
          aria-hidden="true"
        >
          CURRENT
        </motion.div>""",
              """        <motion.div
          className="h2o-practice__current-word"
          style={{ x: currentX, z: currentZ, opacity: currentOpacity }}
          aria-hidden="true"
        >
          <motion.span
            className="h2o-practice__current-word-spatial"
            style={{ x: pointerShiftX, y: pointerShiftY, rotateY: pointerRotateY }}
          >
            CURRENT
          </motion.span>
        </motion.div>""",
              'SpatialPractice pointer layer',
          )
          portfolio = replace_once(
              portfolio,
              """            active={index === activeIndex}
            register={registerChapter}
""",
              """            active={index === activeIndex}
            spatialEnabled={spatialEnabled}
            register={registerChapter}
""",
              'ProjectChapter spatial prop',
          )
          portfolio = replace_once(portfolio, '      <ArchiveCurrent />', '      <ArchiveCurrent spatialEnabled={spatialEnabled} />', 'Archive spatial prop')
          portfolio_path.write_text(portfolio)

          canvas_path = Path('src/components/immersive/LiquidCurrentCanvas.tsx')
          canvas = canvas_path.read_text()
          canvas = replace_once(
              canvas,
              "interface LiquidCurrentCanvasProps {\n",
              "type SpatialPointerSnapshot = { x: number; y: number; presence: number }\n\ninterface LiquidCurrentCanvasProps {\n",
              'canvas pointer type',
          )
          canvas = replace_once(
              canvas,
              "  activityRef: MutableRefObject<number>\n  palette: string[]",
