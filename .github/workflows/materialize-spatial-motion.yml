name: Materialize spatial motion

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-spatial-motion.yml

permissions:
  contents: write

concurrency:
  group: h2o-materialize-spatial-motion
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Materialize Apple-like spatial motion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/materialize-spatial-motion.py')
          source = path.read_text()
          marker = "\nvisual_path = ROOT / '.github/workflows/visual-proof.yml'"
          if source.count(marker) != 1:
              raise SystemExit(f'expected one visual workflow marker, found {source.count(marker)}')
          source = source.replace(
              marker,
              "\nprint('Spatial motion patch materialized.')\nraise SystemExit(0)\n" + marker,
              1,
          )
          exec(compile(source, str(path), 'exec'))
          PY
      - name: Check patch integrity
        run: |
          git diff --check
          node scripts/verify-motion-contract.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Retain verified spatial motion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/immersive/ImmersivePortfolio.tsx src/components/immersive/LiquidCurrentCanvas.tsx src/components/immersive/LiquidCurrentScene.tsx src/styles/immersive.css package.json
          git commit -m "feat: make the portfolio spatially responsive"
          git push origin HEAD:main
