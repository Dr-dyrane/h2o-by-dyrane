              transform: none !important;
            }
          }
          '''
          motion_path.write_text(motion.rstrip() + '\n' + spatial_css.replace('          ', '').strip() + '\n')

          verifier_path = Path('scripts/verify-motion-contract.mjs')
          verifier = verifier_path.read_text()
          verifier = replace_once(
              verifier,
              "requireText('tokens', 'motionSprings', 'tokens: shared spring profiles are missing')\n",
              """requireText('tokens', 'motionSprings', 'tokens: shared spring profiles are missing')
          requireText('tokens', 'pointer:', 'tokens: pointer spring profile is missing')
          requireText('tokens', 'appleEase', 'tokens: Apple-like easing curve is missing')
          requireText('portfolio', 'useLocalSpatialPointer', 'portfolio: local spatial pointer hook is missing')
          requireText('portfolio', 'data-spatial-input', 'portfolio: spatial input state is not exposed')
          requireText('portfolio', 'h2o-project-pointer-light', 'portfolio: project pointer light is missing')
          requireText('scene', "'pointermove'", 'scene: pointer movement does not wake demand rendering')
          requireText('scene', 'pointerRef.current', 'scene: WebGL does not read spatial pointer input')
