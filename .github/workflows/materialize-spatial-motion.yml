          scene = replace_once(scene, '      pointsRef.current.rotation.z = -0.65 + Math.sin(phase * 0.35) * 0.16', '      pointsRef.current.rotation.z = -0.65 + Math.sin(phase * 0.35) * 0.16 + pointerPosition.x * 0.08', 'scene points response')
          scene = replace_once(scene, '      filamentsRef.current.rotation.z = 0.5 + Math.sin(phase * 0.32) * 0.22', '      filamentsRef.current.rotation.z = 0.5 + Math.sin(phase * 0.32) * 0.22 - pointerPosition.y * 0.08', 'scene filament response')
          scene_path.write_text(scene)

          motion_path = Path('src/styles/immersive/motion.css')
          motion = motion_path.read_text()
          motion = replace_once(
