name: Materialize spatial motion

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-spatial-motion.yml

permissions:
  contents: write

concurrency:
  group: h2o-materialize-spatial-motion
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Materialize Apple-like spatial motion
        run: python .github/materialize-spatial-motion.py
      - name: Check patch integrity
        run: |
          git diff --check
          node scripts/verify-motion-contract.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Retain verified spatial motion
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/spatial
          rm .github/materialize-spatial-motion.py
          rm .github/workflows/materialize-spatial-motion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: make the portfolio spatially responsive"
          git push origin HEAD:main
