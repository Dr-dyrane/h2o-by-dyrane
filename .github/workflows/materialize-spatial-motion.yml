          verifier_path.write_text(verifier)

          spatial_test = r'''import { existsSync } from 'node:fs'
          import { mkdir, writeFile } from 'node:fs/promises'
          import { resolve } from 'node:path'
          import puppeteer from 'puppeteer-core'

          const baseUrl = process.env.H2O_SPATIAL_URL || 'http://127.0.0.1:5173'
          const outputDirectory = resolve(process.cwd(), '.spatial-proof')
          const executableCandidates = [
            process.env.PUPPETEER_EXECUTABLE_PATH,
            '/usr/bin/google-chrome-stable',
            '/usr/bin/google-chrome',
            '/usr/bin/chromium',
            '/usr/bin/chromium-browser',
          ].filter(Boolean)
          const executablePath = executableCandidates.find((candidate) => existsSync(candidate))
          if (!executablePath) throw new Error(`No Chromium executable found. Checked: ${executableCandidates.join(', ')}`)

          await mkdir(outputDirectory, { recursive: true })
          const browser = await puppeteer.launch({
            executablePath,
            headless: true,
            args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage', '--hide-scrollbars', '--mute-audio', '--no-first-run'],
          })
          const sleep = (milliseconds) => new Promise((resolvePromise) => setTimeout(resolvePromise, milliseconds))
          const failures = []
          const report = { generatedAt: new Date().toISOString(), baseUrl, desktop: {}, reduced: {} }

          try {
            const page = await browser.newPage()
            await page.setViewport({ width: 1440, height: 1000, deviceScaleFactor: 1, isMobile: false, hasTouch: false })
            await page.emulateMediaFeatures([
              { name: 'prefers-color-scheme', value: 'dark' },
              { name: 'prefers-reduced-motion', value: 'no-preference' },
            ])
            await page.goto(baseUrl, { waitUntil: 'networkidle0', timeout: 60_000 })
            await page.waitForSelector('[data-spatial-input="enabled"]', { timeout: 20_000 })
            await page.evaluate(() => {
              const target = document.getElementById('ivisit')
              if (!target) throw new Error('Missing #ivisit')
              const rect = target.getBoundingClientRect()
              const top = rect.top + window.scrollY
              window.scrollTo(0, top + Math.max(0, rect.height - window.innerHeight) * 0.42)
            })
            await sleep(1100)
            const box = await page.$eval('#ivisit .h2o-project-media', (element) => {
              const rect = element.getBoundingClientRect()
              return { x: rect.x, y: rect.y, width: rect.width, height: rect.height }
            })
            const sample = async (ratioX, ratioY) => {
              await page.mouse.move(box.x + box.width * ratioX, box.y + box.height * ratioY)
              await sleep(560)
              return page.$eval('#ivisit', (chapter) => {
                const plane = chapter.querySelector('.h2o-project-media__spatial')
                const copy = chapter.querySelector('.h2o-project-copy__spatial')
                const light = chapter.querySelector('.h2o-project-pointer-light')
                return {
                  plane: plane ? getComputedStyle(plane).transform : 'missing',
                  copy: copy ? getComputedStyle(copy).transform : 'missing',
                  lightOpacity: light ? Number.parseFloat(getComputedStyle(light).opacity) : 0,
                }
              })
            }
            const left = await sample(0.22, 0.36)
            const right = await sample(0.78, 0.64)
            report.desktop = { left, right }
            if (left.plane === right.plane || left.plane === 'none') failures.push('desktop: project plane did not react spatially')
            if (left.copy === right.copy || left.copy === 'none') failures.push('desktop: project copy did not counter-parallax')
            if (Math.max(left.lightOpacity, right.lightOpacity) < 0.2) failures.push('desktop: pointer light did not become visible')
            await page.screenshot({ path: resolve(outputDirectory, 'desktop-project-hover.png'), captureBeyondViewport: false })
            await page.close()

            const reducedPage = await browser.newPage()
            await reducedPage.setViewport({ width: 1440, height: 1000, deviceScaleFactor: 1, isMobile: false, hasTouch: false })
            await reducedPage.emulateMediaFeatures([
              { name: 'prefers-color-scheme', value: 'dark' },
              { name: 'prefers-reduced-motion', value: 'reduce' },
            ])
            await reducedPage.goto(baseUrl, { waitUntil: 'networkidle0', timeout: 60_000 })
            await reducedPage.waitForSelector('[data-spatial-input="reduced"]', { timeout: 20_000 })
            report.reduced = await reducedPage.evaluate(() => ({
              canvasCount: document.querySelectorAll('canvas').length,
              pointerLightDisplay: getComputedStyle(document.querySelector('.h2o-hero__pointer-light')).display,
            }))
            if (report.reduced.canvasCount !== 0) failures.push('reduced: WebGL canvas should not load')
            if (report.reduced.pointerLightDisplay !== 'none') failures.push('reduced: pointer light should be hidden')
            await reducedPage.screenshot({ path: resolve(outputDirectory, 'reduced-motion.png'), captureBeyondViewport: false })
            await reducedPage.close()
          } finally {
            await browser.close()
          }

          await writeFile(resolve(outputDirectory, 'report.json'), JSON.stringify(report, null, 2))
          if (failures.length > 0) {
            console.error(failures.join('\n'))
            process.exitCode = 1
          } else {
            console.log(`Spatial hover proof passed. Evidence retained in ${outputDirectory}`)
          }
          '''
          Path('scripts/verify-spatial-hover.mjs').write_text(spatial_test.replace('          ', '').rstrip() + '\n')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['scripts']['verify:spatial'] = 'node scripts/verify-spatial-hover.mjs'
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          visual_path = Path('.github/workflows/visual-proof.yml')
          visual = visual_path.read_text()
          visual = replace_once(visual, '      - scripts/verify-visual.mjs\n', '      - scripts/verify-visual.mjs\n      - scripts/verify-spatial-hover.mjs\n', 'visual spatial path')
          visual = replace_once(visual, '      - run: npm run verify:visual\n', '      - run: npm run verify:visual\n      - run: npm run verify:spatial\n', 'visual spatial run')
          visual = replace_once(visual, '          path: .visual-proof/\n', '          path: |\n            .visual-proof/\n            .spatial-proof/\n', 'visual spatial artifact')
          visual_path.write_text(visual)

          ignore_path = Path('.gitignore')
          ignore = ignore_path.read_text()
          if '.spatial-proof/' not in ignore:
              ignore = ignore.rstrip() + '\n.spatial-proof/\n'
          ignore_path.write_text(ignore)
          PY
      - run: npm ci
      - run: node scripts/verify-motion-contract.mjs
      - run: npm run lint
      - run: npm run build
      - name: Locate Chromium
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            npx @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/puppeteer"
            browser="$(find "$RUNNER_TEMP/puppeteer" -type f \( -name chrome -o -name chromium \) | head -n 1)"
          fi
          test -n "$browser"
          echo "PUPPETEER_EXECUTABLE_PATH=$browser" >> "$GITHUB_ENV"
      - name: Start production server
        shell: bash
        run: |
          npm run start > /tmp/h2o-spatial-server.log 2>&1 &
          echo $! > /tmp/h2o-spatial-server.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5173 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/h2o-spatial-server.log
          exit 1
      - run: npm run verify:spatial
      - run: git diff --check
      - name: Retain verified spatial motion
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-spatial-motion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .gitignore \
            package.json \
            scripts/verify-motion-contract.mjs \
            scripts/verify-spatial-hover.mjs \
            src/components/immersive/ImmersivePortfolio.tsx \
            src/components/immersive/LiquidCurrentCanvas.tsx \
            src/components/immersive/LiquidCurrentScene.tsx \
            src/motion/tokens.ts \
            src/styles/immersive/motion.css \
            .github/workflows/visual-proof.yml \
            .github/workflows/materialize-spatial-motion.yml
          git commit -m "feat: add spatial Apple-like motion"
          git push origin HEAD:main
