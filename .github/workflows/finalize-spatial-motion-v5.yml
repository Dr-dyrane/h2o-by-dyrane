name: Finalize spatial motion v5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-spatial-motion-v5.yml

permissions:
  contents: write

concurrency:
  group: h2o-spatial-motion-materializer-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Materialize and refine spatial source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return source.replace(old, new, 1)

          if not Path('scripts/verify-spatial-hover.mjs').exists() or 'pointerSlow' not in Path('src/motion/tokens.ts').read_text():
              workflow_path = Path('.github/workflows/materialize-spatial-motion.yml')
              if not workflow_path.exists():
                  raise SystemExit('Spatial source is absent and its materializer is unavailable.')
              workflow = workflow_path.read_text().splitlines()
              start = workflow.index("          python - <<'PY'") + 1
              end = workflow.index('          PY', start)
              script = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end])

              hook_line = "portfolio = replace_once(portfolio, hook_marker, local_hook.replace('          ', '') + hook_marker, 'local spatial hook')"
              project_line = "portfolio = replace_between(portfolio, 'function ProjectChapter({', '\\ntype PracticeStep =', project_chapter.replace('          ', ''), 'ProjectChapter')"
              ordered = hook_line + '\n' + project_line
              corrected = project_line + '\n' + hook_line
              if script.count(ordered) != 1:
                  raise SystemExit(f'expected one materializer order fragment, found {script.count(ordered)}')
              script = script.replace(ordered, corrected, 1)

              transform_pattern = re.compile(
                  r"(?m)^(?P<indent>\s*)const pointerShiftX = useTransform\(\[pointerX, pointerPresence\], \(\[x, presence\]\) => x \* presence \* 38\)\n"
                  r"(?P=indent)const pointerShiftY = useTransform\(\[pointerY, pointerPresence\], \(\[y, presence\]\) => y \* presence \* 22\)\n"
                  r"(?P=indent)const pointerRotateY = useTransform\(\[pointerX, pointerPresence\], \(\[x, presence\]\) => x \* presence \* 3\.2\)"
              )
              script, replacements = transform_pattern.subn(
                  lambda match: (
                      f"{match.group('indent')}const pointerShiftX = useTransform(pointerX, [-1, 1], [-38, 38])\n"
                      f"{match.group('indent')}const pointerShiftY = useTransform(pointerY, [-1, 1], [-22, 22])\n"
                      f"{match.group('indent')}const pointerRotateY = useTransform(pointerX, [-1, 1], [-3.2, 3.2])"
                  ),
                  script,
                  count=1,
              )
              if replacements != 1:
                  raise SystemExit(f'expected one practice transform fragment, found {replacements}')
              exec(compile(script, 'spatial-materializer', 'exec'), {})

          portfolio_path = Path('src/components/immersive/ImmersivePortfolio.tsx')
          portfolio = portfolio_path.read_text()
          if 'pointerWordScale' not in portfolio:
              portfolio = replace_once(
                  portfolio,
                  "  const pointerRotateY = useTransform(pointerX, [-1, 1], [-3.2, 3.2])\n",
                  "  const pointerRotateY = useTransform(pointerX, [-1, 1], [-3.2, 3.2])\n  const pointerWordScale = useTransform(pointerPresence, [0, 1], [1, 1.008])\n",
                  'practice pointer settle scale',
              )
              portfolio = replace_once(
                  portfolio,
                  '            style={{ x: pointerShiftX, y: pointerShiftY, rotateY: pointerRotateY }}',
                  '            style={{ x: pointerShiftX, y: pointerShiftY, rotateY: pointerRotateY, scale: pointerWordScale }}',
                  'practice pointer scale style',
              )
          portfolio_path.write_text(portfolio)

          motion_path = Path('src/styles/immersive/motion.css')
          motion = motion_path.read_text()
          coarse_marker = """@media (pointer: coarse), (max-width: 900px) {
  .h2o-hero__pointer-light,"""
          coarse_replacement = """@media (pointer: coarse), (max-width: 900px) {
  .h2o-archive-card:hover {
    transform: translateY(-36%) translateZ(0) rotateY(0deg);
  }

  .h2o-hero__pointer-light,"""
          if 'translateY(-36%) translateZ(0) rotateY(0deg)' not in motion:
              motion = replace_once(motion, coarse_marker, coarse_replacement, 'coarse archive hover reset')

          reduced_marker = """@media (prefers-reduced-motion: reduce) {
  .h2o-hero__pointer-light,"""
          reduced_replacement = """@media (prefers-reduced-motion: reduce) {
  .h2o-archive-card,
  .h2o-archive-card:hover {
    transform: none !important;
  }

  .h2o-hero__pointer-light,"""
          if '.h2o-archive-card:hover {\n    transform: none !important;' not in motion:
              motion = replace_once(motion, reduced_marker, reduced_replacement, 'reduced archive hover reset')
          motion_path.write_text(motion)
          PY
      - run: npm ci
      - run: node scripts/verify-motion-contract.mjs
      - run: npm run lint
      - run: npm run build
      - name: Locate Chromium
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            npx @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/puppeteer"
            browser="$(find "$RUNNER_TEMP/puppeteer" -type f \( -name chrome -o -name chromium \) | head -n 1)"
          fi
          test -n "$browser"
          echo "PUPPETEER_EXECUTABLE_PATH=$browser" >> "$GITHUB_ENV"
      - name: Start production server
        shell: bash
        run: |
          npm run start > /tmp/h2o-spatial-final-v5.log 2>&1 &
          echo $! > /tmp/h2o-spatial-final-v5.pid
          for attempt in {1..75}; do
            for port in 5173 4173 3000; do
              if curl --fail --silent "http://127.0.0.1:${port}" > /dev/null; then
                echo "H2O_SPATIAL_URL=http://127.0.0.1:${port}" >> "$GITHUB_ENV"
                exit 0
              fi
            done
            sleep 1
          done
          cat /tmp/h2o-spatial-final-v5.log
          exit 1
      - run: npm run verify:spatial
      - run: git diff --check
      - name: Publish certified spatial motion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/portfolio
          source_head="$(git rev-parse HEAD)"
          cat > docs/portfolio/spatial-motion-validation.md <<EOF
          # Spatial motion validation

          The H₂O portfolio motion system is certified against the production build.

          - Lower-frequency shared springs absorb wheel and trackpad stepping.
          - Fine-pointer movement changes the hero viewpoint, project-plane tilt, counter-parallax, local light, archive depth, and WebGL current.
          - Touch and coarse pointers remain flat and stable.
          - Reduced-motion mode removes pointer depth and the WebGL canvas.
          - Browser proof: \`npm run verify:spatial\`.
          - Source head validated: \`${source_head}\`.
          EOF
          rm -f .github/workflows/materialize-spatial-motion.yml
          rm -f .github/workflows/materialize-spatial-motion-v2.yml
          rm -f .github/workflows/certify-spatial-motion.yml
          rm -f .github/workflows/finalize-spatial-motion.yml
          rm -f .github/workflows/finalize-spatial-motion-v2.yml
          rm -f .github/workflows/finalize-spatial-motion-v3.yml
          rm -f .github/workflows/finalize-spatial-motion-v4.yml
          rm -f .github/workflows/finalize-spatial-motion-v5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: release spatial Apple-like motion"
          git push origin HEAD:main
