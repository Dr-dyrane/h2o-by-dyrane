name: Materialize H2O spatial pass

on:
  push:
    branches: [main]
    paths:
      - .staging/spatial-pass/**
      - .github/workflows/materialize-spatial-pass.yml

permissions:
  contents: write

concurrency:
  group: h2o-materialize-spatial-pass
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Materialize the coherent spatial pass
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p src/components/immersive src/data src/styles/immersive scripts

          cp .staging/spatial-pass/files/src/components/immersive/LiquidCurrentScene.tsx src/components/immersive/LiquidCurrentScene.tsx
          cp .staging/spatial-pass/files/src/data/immersiveProjects.ts src/data/immersiveProjects.ts
          cp .staging/spatial-pass/files/src/styles/immersive.css src/styles/immersive.css
          cp .staging/spatial-pass/files/src/styles/immersive/base.css src/styles/immersive/base.css
          cp .staging/spatial-pass/files/src/styles/immersive/spatial.css src/styles/immersive/spatial.css
          cp .staging/spatial-pass/files/src/styles/immersive/projects.css src/styles/immersive/projects.css
          cp .staging/spatial-pass/files/src/styles/immersive/archive.css src/styles/immersive/archive.css
          cp .staging/spatial-pass/files/src/styles/immersive/responsive.css src/styles/immersive/responsive.css

          cat .staging/spatial-pass/chunks/ImmersivePortfolio.* | tr -d '\n\r ' | base64 --decode > src/components/immersive/ImmersivePortfolio.tsx
          cat .staging/spatial-pass/chunks/verify-visual.* | tr -d '\n\r ' | base64 --decode > scripts/verify-visual.mjs

          echo '1058186d0d02de1bcb404a0d1c7510eb1b09afc6addaab7e5b827a4ab4a5216f  src/components/immersive/ImmersivePortfolio.tsx' | sha256sum -c -
          echo 'aa14c66a6c072ac17bff6d0fdaba615a12d2aa982c157ee24a41b5448eeb9bb0  scripts/verify-visual.mjs' | sha256sum -c -

          npm ci
          npm run lint
          npm run build

          rm -rf .staging/spatial-pass
          rm .github/workflows/materialize-spatial-pass.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: turn H2O into a continuous spatial journey"
          git push
