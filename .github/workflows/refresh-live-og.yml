name: Refresh live H2O Open Graph

on:
  workflow_dispatch:
  schedule:
    - cron: "29 6 * * 1"
  push:
    branches: [main]
    paths:
      - src/components/immersive/**
      - src/motion/**
      - src/styles/immersive/**
      - scripts/generate-og-image.mjs
      - index.html
      - .github/workflows/refresh-live-og.yml

permissions:
  contents: write

concurrency:
  group: h2o-live-og
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Locate Chromium
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            npx @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/puppeteer"
            browser="$(find "$RUNNER_TEMP/puppeteer" -type f \( -name chrome -o -name chromium \) | head -n 1)"
          fi
          test -n "$browser"
          echo "PUPPETEER_EXECUTABLE_PATH=$browser" >> "$GITHUB_ENV"
      - name: Start production build
        shell: bash
        run: |
          npm run start > /tmp/h2o-og-server.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5173 > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/h2o-og-server.log
          exit 1
      - run: npm run generate:og
        env:
          H2O_OG_URL: http://127.0.0.1:5173
      - run: npm run verify:og
      - run: npm run build:client
      - name: Retain changed hero
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/og-image-live.png index.html
          if git diff --cached --quiet; then
            echo "Live OG already matches the current hero."
            exit 0
          fi
          git commit -m "chore: refresh live H2O Open Graph [skip ci]"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: h2o-live-og
          path: public/og-image-live.png
          retention-days: 30
