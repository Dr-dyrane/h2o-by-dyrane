name: Refresh live hero Open Graph

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-live-hero-og.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h2o-live-hero-og
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install from package.json without trusting the stale lock
        run: npm install --package-lock=false --no-audit --no-fund
      - run: npm run build

      - name: Locate Chromium
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            npx @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/puppeteer"
            browser="$(find "$RUNNER_TEMP/puppeteer" -type f \( -name chrome -o -name chromium \) | head -n 1)"
          fi
          test -n "$browser"
          echo "PUPPETEER_EXECUTABLE_PATH=$browser" >> "$GITHUB_ENV"
          "$browser" --version

      - name: Start the production build
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/h2o-og-server.log 2>&1 &
          echo $! > /tmp/h2o-og-server.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/h2o-og-server.log
          exit 1

      - name: Capture the actual rendered hero
        env:
          H2O_OG_URL: http://127.0.0.1:5173
        run: npm run generate:og

      - name: Verify social-image contract
        run: npm run verify:og

      - name: Retain the rendered hero for review
        uses: actions/upload-artifact@v4
        with:
          name: h2o-live-hero-og
          path: public/og-image-live.png
          if-no-files-found: error
          retention-days: 30

      - name: Commit and publish the cache-busted live render
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-live-hero-og.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/og-image-live.png index.html .github/workflows/refresh-live-hero-og.yml
          git commit -m "fix: publish the current hero as the Open Graph image"

          for attempt in {1..6}; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "Unable to publish the verified OG render after six rebases."
          exit 1
