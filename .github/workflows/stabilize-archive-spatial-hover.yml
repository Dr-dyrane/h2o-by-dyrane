name: Stabilize archive spatial hover

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stabilize-archive-spatial-hover.yml

permissions:
  contents: write

concurrency:
  group: h2o-stabilize-archive-spatial-hover
  cancel-in-progress: false

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Put pointer capture on a stable archive hit plane
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          portfolio_path = Path('src/components/immersive/ImmersivePortfolio.tsx')
          portfolio = portfolio_path.read_text()

          old_hook = 'useSpatialPointer<HTMLElement>'
          new_hook = 'useSpatialPointer<HTMLDivElement>'
          if portfolio.count(old_hook) != 1:
              raise SystemExit(f'expected one archive pointer hook, found {portfolio.count(old_hook)}')
          portfolio = portfolio.replace(old_hook, new_hook, 1)

          old_binding = "      data-spatial-enabled={spatialEnabled ? 'true' : 'false'}\n      {...pointer.bind}\n    >\n      <motion.div"
          new_binding = "      data-archive-index={index}\n      data-spatial-enabled={spatialEnabled ? 'true' : 'false'}\n    >\n      <div\n        className=\"h2o-archive-card__hit-area\"\n        {...pointer.bind}\n        aria-hidden=\"true\"\n      />\n      <motion.div"
          if portfolio.count(old_binding) != 1:
              raise SystemExit(f'expected one archive card binding, found {portfolio.count(old_binding)}')
          portfolio = portfolio.replace(old_binding, new_binding, 1)
          portfolio_path.write_text(portfolio)

          css_path = Path('src/styles/immersive/archive-spatial-hit.css')
          css_path.write_text('\n'.join([
              '/* Stable pointer capture for archive cards.',
              '   The hit surface stays fixed while the visual plane moves beneath it. */',
              '',
              '.h2o-archive-card > .h2o-archive-card__hit-area {',
              '  position: absolute;',
              '  inset: 0;',
              '  z-index: 8;',
              '  border-radius: inherit;',
              '  cursor: default;',
              '  pointer-events: auto;',
              '  touch-action: pan-y;',
              '  transform: translateZ(180px);',
              '}',
              '',
              '.h2o-archive-card > .h2o-archive-card__spatial {',
              '  pointer-events: none;',
              '}',
              '',
              '@media (pointer: coarse), (max-width: 900px) {',
              '  .h2o-archive-card > .h2o-archive-card__hit-area {',
              '    display: none;',
              '  }',
              '}',
              '',
              '@media (prefers-reduced-motion: reduce) {',
              '  .h2o-archive-card > .h2o-archive-card__hit-area {',
              '    display: none;',
              '  }',
              '}',
              '',
          ]))

          imports_path = Path('src/styles/immersive.css')
          imports = imports_path.read_text()
          old_import = "@import './immersive/spatial-interaction.css';\n"
          new_import = "@import './immersive/spatial-interaction.css';\n@import './immersive/archive-spatial-hit.css';\n"
          if imports.count(old_import) != 1:
              raise SystemExit(f'expected one spatial stylesheet import, found {imports.count(old_import)}')
          imports_path.write_text(imports.replace(old_import, new_import, 1))

          verifier_path = Path('scripts/verify-spatial-hover.mjs')
          verifier = verifier_path.read_text()
          probe_start = verifier.index('  const archiveTarget = await page.evaluate(() => {')
          probe_end = verifier.index('  const archiveSelector =', probe_start)
          archive_probe = '\n'.join([
              '  const archiveTarget = await page.evaluate(() => {',
              "    const cards = [...document.querySelectorAll('.h2o-archive-card')]",
              '    const minY = Math.round(window.innerHeight * 0.38)',
              '    const maxY = Math.round(window.innerHeight * 0.9)',
              '    const minX = Math.round(window.innerWidth * 0.08)',
              '    const maxX = Math.round(window.innerWidth * 0.92)',
              '',
              '    for (let y = minY; y <= maxY; y += 24) {',
              '      for (let x = minX; x <= maxX; x += 24) {',
              '        const topElement = document.elementFromPoint(x, y)',
              "        const hitArea = topElement?.closest('.h2o-archive-card__hit-area')",
              '        if (!hitArea) continue',
              "        const card = hitArea.closest('.h2o-archive-card')",
              '        if (!card) continue',
              '        const index = cards.indexOf(card)',
              '        return {',
              '          index,',
              '          x,',
              '          y,',
              "          title: card.querySelector('h3')?.textContent?.trim() || `archive-${index}`,",
              "          topClass: topElement.className || topElement.tagName,",
              '        }',
              '      }',
              '    }',
              '',
              "    throw new Error('No archive hit surface was topmost in the viewport')",
              '  })',
              '',
          ])
          verifier_path.write_text(verifier[:probe_start] + archive_probe + verifier[probe_end:])
          PY
      - name: Verify source contract
        run: |
          git diff --check
          node scripts/verify-motion-contract.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Locate Chromium
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            npx @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/puppeteer"
            browser="$(find "$RUNNER_TEMP/puppeteer" -type f \( -name chrome -o -name chromium \) | head -n 1)"
          fi
          test -n "$browser"
          echo "PUPPETEER_EXECUTABLE_PATH=$browser" >> "$GITHUB_ENV"
      - name: Start production server
        shell: bash
        run: |
          npm run start > /tmp/h2o-server.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5173 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/h2o-server.log
          exit 1
      - run: npm run verify:visual
      - run: npm run verify:spatial
      - name: Retain verified archive hover
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/immersive/ImmersivePortfolio.tsx src/styles/immersive.css src/styles/immersive/archive-spatial-hit.css scripts/verify-spatial-hover.mjs
          git commit -m "fix: stabilize archive spatial hover"
          git push origin HEAD:main
