name: Repair reduced motion detection

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-reduced-motion-detection.yml

permissions:
  contents: write

concurrency:
  group: h2o-repair-reduced-motion-detection
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Bind reduced motion directly to matchMedia
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/immersive/ImmersivePortfolio.tsx')
          source = path.read_text()

          old = "  useMotionValueEvent,\n  useReducedMotion,\n  useScroll,"
          new = "  useMotionValueEvent,\n  useScroll,"
          if source.count(old) != 1:
              raise SystemExit(f'expected one Framer reduced-motion import, found {source.count(old)}')
          source = source.replace(old, new, 1)

          marker = "] as const\n\nfunction ProjectImage({"
          hook = (
              "] as const\n\n"
              "function useBrowserReducedMotion() {\n"
              "  const [shouldReduceMotion, setShouldReduceMotion] = useState(false)\n\n"
              "  useEffect(() => {\n"
              "    const mediaQuery = window.matchMedia('(prefers-reduced-motion: reduce)')\n"
              "    const syncPreference = () => setShouldReduceMotion(mediaQuery.matches)\n\n"
              "    syncPreference()\n"
              "    mediaQuery.addEventListener('change', syncPreference)\n"
              "    return () => mediaQuery.removeEventListener('change', syncPreference)\n"
              "  }, [])\n\n"
              "  return shouldReduceMotion\n"
              "}\n\n"
              "function ProjectImage({"
          )
          if source.count(marker) != 1:
              raise SystemExit(f'expected one practice marker, found {source.count(marker)}')
          source = source.replace(marker, hook, 1)

          old = "  const shouldReduceMotion = useReducedMotion()\n  const spatialEnabled = shouldReduceMotion !== true"
          new = "  const shouldReduceMotion = useBrowserReducedMotion()\n  const spatialEnabled = !shouldReduceMotion"
          if source.count(old) != 1:
              raise SystemExit(f'expected one Framer preference call, found {source.count(old)}')
          source = source.replace(old, new, 1)

          path.write_text(source)
          PY
      - run: node scripts/verify-motion-contract.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Retain repaired preference detection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/immersive/ImmersivePortfolio.tsx
          git commit -m "fix: bind reduced motion to the browser preference"
          git push origin HEAD:main
